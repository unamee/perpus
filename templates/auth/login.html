{% extends 'base.html' %}

{% block content %}

<div
    class="uk-width-1-3@m
           uk-margin-auto">

<div
    class="uk-card
           uk-card-default
           uk-card-body">

<h2>

Login

</h2>

<form method="post">

{% csrf_token %}

<div class="uk-margin">

<label>

Username

</label>

<input
    class="uk-input"
    type="text"
    name="username">

</div>

<div class="uk-margin">

<label>

Password

</label>

<input
    class="uk-input"
    type="password"
    name="password">

</div>

<button
    class="uk-button
           uk-button-primary
           uk-width-1-1">

Login

</button>

</form>

</div>

</div>

{% endblock %}
