{% extends 'base.html' %} {% block content %}

<h1 class="uk-heading-divider">Dashboard</h1>

<div

    hx-get="/reports/metrics/"

    hx-trigger="load, every 30s"

    hx-swap="innerHTML">

</div>

<hr />

<h3>Top Readers</h3>

<table class="uk-table uk-table-divider">
  <thead>
    <tr>
      <th>User</th>

      <th>Total Borrow</th>
    </tr>
  </thead>

  <tbody>
    {% for user in top_readers %}

    <tr>
      <td>{{ user.username }}</td>

      <td>{{ user.total_borrow }}</td>
    </tr>

    {% endfor %}
  </tbody>
</table>

<hr />

<h3>Inventory Summary</h3>

<table class="uk-table uk-table-striped">
  <thead>
    <tr>
      <th>Status</th>

      <th>Total</th>
    </tr>
  </thead>

  <tbody>
    {% for row in inventory %}

    <tr>
      <td>{{ row.status }}</td>

      <td>{{ row.total }}</td>
    </tr>

    {% endfor %}
  </tbody>
</table>

{% endblock %}
