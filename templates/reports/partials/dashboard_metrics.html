<div
    class="uk-grid-small
           uk-child-width-1-4@m"
    uk-grid>

    <div>

        <div
            class="uk-card
                   uk-card-primary
                   uk-card-body">

            <h3>

                Active Borrow

            </h3>

            <h1>

                {{ active_borrow_count }}

            </h1>

        </div>

    </div>

    <div>

        <div
            class="uk-card
                   uk-card-danger
                   uk-card-body">

            <h3>

                Overdue

            </h3>

            <h1>

                {{ overdue_count }}

            </h1>

        </div>

    </div>

    <div>

        <div
            class="uk-card
                   uk-card-warning
                   uk-card-body">

            <h3>

                Unpaid Fine

            </h3>

            <h1>

                {{ unpaid_fine_count }}

            </h1>

        </div>

    </div>

</div>
