{% extends 'base.html' %} {% block content %}

<div class="uk-card uk-card-default uk-card-body">
  <h2>Borrow Book</h2>

  <form
    hx-post="/circulation/borrow-submit/"
    hx-target="#borrow-result"
    hx-swap="innerHTML"
  >
    {% csrf_token %}

    <div class="uk-margin">
      <label>Barcode</label>

      <input
        class="uk-input"
        name="barcode"
        hx-get="/circulation/barcode-lookup/"
        hx-trigger="keyup changed delay:500ms"
        hx-target="#book-result"
        placeholder="Scan barcode"
      />
    </div>

    <div id="book-result"></div>

    <div class="uk-margin">
      <label>Borrower</label>

      <select
        class="uk-select"
        name="borrower"
        hx-get="/circulation/due-date-preview/"
        hx-trigger="change"
        hx-target="#due-date-preview"
      >
        <option value="">Select Borrower</option>

        {% for user in borrowers %}

        <option value="{{ user.id }}">{{ user.username }}</option>

        {% endfor %}
      </select>
      <div id="due-date-preview"></div>
    </div>

    <button class="uk-button uk-button-primary">Borrow</button>
  </form>

  <div id="borrow-result"></div>
</div>

{% endblock %}
