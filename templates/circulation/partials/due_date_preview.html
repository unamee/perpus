{% if policy %}

<div class="uk-card uk-card-primary uk-card-body uk-margin">
  <h4>Borrow Policy</h4>

  <p>Role: {{ borrower.role }}</p>

  <p>Loan Days: {{ policy.loan_days }}</p>

  <p>

    <strong> {{ due_date }} </strong>
  </p>
</div>

{% endif %}
