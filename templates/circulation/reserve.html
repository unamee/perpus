{% extends 'base.html' %}

{% block content %}

<div
    class="uk-card
           uk-card-default
           uk-card-body">

<h2>

Reserve Book

</h2>

<form
    hx-post="/circulation/reserve-submit/"
    hx-target="#reserve-result">

{% csrf_token %}

<div class="uk-margin">

<label>

Book

</label>

<select
    class="uk-select"
    name="book">

    {% for book in books %}

    <option
        value="{{ book.id }}">

        {{ book.title }}

    </option>

    {% endfor %}

</select>

</div>

<div class="uk-margin">

<label>

User

</label>

<select
    class="uk-select"
    name="user">

    {% for user in users %}

    <option
        value="{{ user.id }}">

        {{ user.username }}

    </option>

    {% endfor %}

</select>

</div>

<button
    class="uk-button
           uk-button-primary">

Create Reservation

</button>

</form>

<div id="reserve-result">

</div>

</div>

{% endblock %}
